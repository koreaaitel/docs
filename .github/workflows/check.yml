name: fern-check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: fern-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@d07601425e9c9ede8745d71ca75c4c462d98755d # v1

      - name: Check API is valid
        run: fern check

      # 드리프트 검사는 배포와 머지 사이에 일부러 빨개지므로 이 단계를 그보다 앞에 둔다.
      - name: Test OpenAPI sync
        run: node --test scripts/sync-openapi.test.mjs

      # fern/openapi.json 은 제품 저장소 스펙의 사본이라 PR 을 머지하기 전까지는 뒤처진다.
      # 운영 /openapi.json 과 비교해 동일 경로의 설명·예시 변경도 찾는다.
      - name: Check OpenAPI drift
        run: node scripts/check-openapi-drift.mjs
