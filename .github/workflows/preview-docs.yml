name: Preview Docs

on: pull_request

concurrency:
  group: fern-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Fetch full history for git diff

      - name: Checkout PR
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
          git checkout pr-${{ github.event.pull_request.number }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@d07601425e9c9ede8745d71ca75c4c462d98755d # v1

      - name: Verify Fern credentials
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -z "$FERN_TOKEN" ]; then
            echo "::error::FERN_TOKEN repository secret is required"
            exit 1
          fi

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: |
          set +e
          OUTPUT=$(fern generate --docs --preview --id "$PREVIEW_ID" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Fern preview generation failed"
            exit "$STATUS"
          fi
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          if [ -z "$URL" ]; then
            echo "::error::Fern preview URL was not found in the publish output"
            exit 1
          fi
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Get page links for changed MDX files
        id: page-links
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          PREVIEW_URL="${{ steps.generate-docs.outputs.preview_url }}"
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.mdx' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "page_links=" >> $GITHUB_OUTPUT; exit 0
          fi
          
          BASE_URL=$(echo "$PREVIEW_URL" | grep -oP 'https?://[^/]+')
          
          FILES_PARAM=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
          RESPONSE=$(curl -sf -H "FERN_TOKEN: $FERN_TOKEN" "${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}" 2>/dev/null) || {
            echo "page_links=" >> $GITHUB_OUTPUT; exit 0
          }
          
          PAGE_LINKS=$(echo "$RESPONSE" | jq -r --arg url "$BASE_URL" \
            '.mappings[] | select(.slug != null) | "- [\(.slug)](\($url)/\(.slug))"')
          
          if [ -n "$PAGE_LINKS" ]; then
            { echo "page_links<<EOF"; echo "$PAGE_LINKS"; echo "EOF"; } >> $GITHUB_OUTPUT
          else
            echo "page_links=" >> $GITHUB_OUTPUT
          fi

      - name: Create comment content
        run: |
          echo ":herb: **Preview your docs:** <${{ steps.generate-docs.outputs.preview_url }}>" > comment.md
          
          if [ -n "${{ steps.page-links.outputs.page_links }}" ]; then
            echo "" >> comment.md
            echo "Here are the markdown pages you've updated:" >> comment.md
            echo "${{ steps.page-links.outputs.page_links }}" >> comment.md
          fi

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- fern-preview-docs -->"
          {
            cat comment.md
            printf '\n%s\n' "$MARKER"
          } > comment-with-marker.md

          # Upsert by looking up an existing comment that carries our hidden marker.
          EXISTING_ID=$(gh api --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")

          jq -Rn --rawfile body comment-with-marker.md '{body: $body}' > payload.json

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" --input payload.json
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input payload.json
          fi
